<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0f14">
  <title>バス運用履歴</title>
  <link rel="stylesheet" href="./unyo.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-mark">BUS</div>
      <div>
        <div class="eyebrow">OPERATION ARCHIVE</div>
        <h1>バス運用履歴</h1>
        <div id="updated"></div>
      </div>
    </div>
  </header>

  <main>
    <section class="controls" aria-label="表示条件">
      <div class="control-block operator-block">
        <span class="control-label">事業者</span>
        <div id="tabs"></div>
      </div>

      <label class="control-block">
        <span class="control-label">日付</span>
        <select id="date"></select>
      </label>

      <label class="control-block search-block">
        <span class="control-label">車番検索</span>
        <input id="search" type="search" inputmode="numeric" placeholder="例 101">
      </label>
    </section>

    <section class="result-head">
      <div id="summary"></div>
      <div id="status">読み込み中...</div>
    </section>

    <section id="list"></section>
  </main>

  <footer>
    BUS OPERATION ARCHIVE
  </footer>

  <script src="./unyo.js"></script>
</body>
</html>
