<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f8fb">
  <title>バス運用履歴</title>
  <link rel="stylesheet" href="./unyo.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <div>
        <div class="site-kicker">BUS OPERATION ARCHIVE</div>
        <h1>バス運用履歴</h1>
        <div id="updated"></div>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="control-panel">
      <div class="control-group control-group--operator">
        <div class="control-title">事業者</div>
        <div id="tabs"></div>
      </div>

      <label class="control-group">
        <span class="control-title">日付</span>
        <select id="date"></select>
      </label>

      <label class="control-group control-group--search">
        <span class="control-title">車番検索</span>
        <div class="search-wrap">
          <input id="search" type="search" inputmode="numeric" autocomplete="off" placeholder="例：101">
          <button id="clearSearch" type="button" aria-label="検索をクリア">×</button>
        </div>
      </label>
    </section>

    <section class="summary-panel">
      <div id="summary"></div>
      <div id="status">読み込み中...</div>
    </section>

    <section id="list" class="vehicle-list"></section>
  </main>

  <script src="./unyo.js"></script>
</body>
</html>
